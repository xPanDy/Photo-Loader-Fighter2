
name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
    
      - name: Build APK
        run: |
          unzip -q PhotoArena.zip
          cd PhotoArena
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoArena-apk
          path: PhotoArena/app/build/outputs/apk/debug/app-debug.apk
